# Conexión a PostgreSQL. Los valores NO están acá: vienen del perfil local
# (src/main/resources/application-local.properties, no versionado) o de las variables
# de entorno DB_URL / DB_USERNAME / DB_PASSWORD.
# Sin una de las dos, Spring falla al arrancar con un placeholder sin resolver.
# Cómo configurarlo: ver README.md, sección "1. Backend".

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave de firma de los JWT. El valor real vive en el perfil local, nunca acá.
# Fase B de Plan-Mejoras.md: JwtService pasa a leer esta propiedad y la rechaza si viene
# vacía o con menos de 32 bytes. Hoy todavía usa la constante hardcoded del propio JwtService.
restosync.jwt.secret=${JWT_SECRET:}
